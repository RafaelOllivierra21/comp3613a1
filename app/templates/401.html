{% extends "base.html" %}
{% block title %}Session Expired | InternBridge{% endblock %}
{% block content %}
<main class="auth-shell">
    <section class="auth-panel session-expired-panel">
        <a class="auth-brand" href="{{ url_for('index_view') }}" aria-label="InternBridge home">
            <img
                class="brand-logo"
                src="{{ url_for('static', path='img/internbridge-light.png') }}"
                alt="InternBridge"
            >
        </a>
        <p class="session-error-code mb-2">401</p>
        <h1 class="h3 fw-bold mb-3">Session expired</h1>
        <p class="text-muted mb-4">
            Your session has expired or you do not have permission to access this page.
            Please sign in again to continue.
        </p>
        <a href="{{ url_for('login_view') }}" class="btn btn-primary btn-lg w-100">
            Return to Login
        </a>
    </section>
</main>
{% endblock %}
