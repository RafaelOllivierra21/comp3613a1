{% extends "base.html" %}
{% from "_flash_messages.html" import render_flash_messages %}
{% block title %}Create an account | InternBridge{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="auth-panel">
    <a class="auth-back" href="{{ url_for('index_view') }}">← Home</a>
    <div class="auth-brand">
      <img class="brand-logo" src="{{ url_for('static', path='img/internbridge-light.png') }}" alt="InternBridge">
    </div>
    <p class="auth-tagline">Create your InternBridge account.</p>

    <form method="POST" action="{{ url_for('register_view') }}">
      <div class="mb-3">
        <label class="form-label" for="username">Username</label>
        <input class="form-control" type="text" id="username" name="username" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" for="fullName">Full name</label>
        <input class="form-control" type="text" id="fullName" name="fullName" required autocomplete="name">
      </div>
      <div class="mb-3">
        <label class="form-label" for="number">Phone number</label>
        <input class="form-control" type="tel" id="number" name="number" required autocomplete="tel">
      </div>
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input class="form-control" type="email" id="email" name="email" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" type="password" id="password" name="password" required>
      </div>
      <div class="d-grid gap-2 mb-3">
        <button class="btn btn-primary btn-lg" type="submit">Register</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('login_view') }}">Back to sign in</a>
      </div>

      {{ render_flash_messages(request) }}
    </form>
  </div>
</div>
{% endblock %}
